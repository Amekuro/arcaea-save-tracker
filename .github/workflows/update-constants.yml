name: Auto Update Arcaea Constants

on:
  schedule:
    # 每 8 小时执行一次定数表拉取，以尽可能快地跟上维基更新 (0:00, 8:00, 16:00 UTC)
    - cron: '0 */8 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-constants:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          
      - name: Install dependencies
        run: npm ci
        
      - name: Run Pipeline Stage 4 - Fetch Constants
        # 内部有智能拦截器：如果版本没有更新且已同步完成，会直接 0 状态退出，不发请求
        run: node scripts/04_fetch_constants.js
        
      - name: Check for changes
        id: check_changes
        run: |
          git status
          if [ -n "$(git status --porcelain)" ]; then
            echo "changes_exist=true" >> $GITHUB_OUTPUT
          else
            echo "changes_exist=false" >> $GITHUB_OUTPUT
          fi
          
      - name: Commit and Push Constants
        if: steps.check_changes.outputs.changes_exist == 'true'
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data/ChartConstant.json public/data/version.json
          git commit -m "Auto-update Arcaea Wiki Constants [skip ci]"
          git push
